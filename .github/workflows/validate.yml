name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install skills-ref mypy

      - name: Validate every skill against the Agent Skills spec
        run: |
          shopt -s nullglob
          found=0
          for skill in skills/*/; do
            found=1
            echo "::group::$skill"
            agentskills validate "$skill"
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then echo "no skills yet"; fi

      - name: Type check
        run: |
          # Per directory, not `mypy --strict .`: two skills each ship a build.py, and mypy
          # rejects duplicate module basenames across a single invocation.
          for dir in skills/*/ hooks tools; do
            if find "$dir" -name '*.py' -print -quit | grep -q .; then
              echo "::group::mypy $dir"
              mypy --strict "$dir"
              echo "::endgroup::"
            fi
          done

      - name: Skill READMEs are current
        run: python tools/gen_skill_readmes.py --check

      - name: Run tests
        run: |
          shopt -s nullglob globstar
          found=0
          for test in **/test_*.py; do
            found=1
            echo "::group::$test"
            ( cd "$(dirname "$test")" && python "$(basename "$test")" )
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then echo "no tests yet"; fi

